<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SIPA Disarpus Kab. Cirebon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div class="card border-0 shadow-sm rounded-4 p-4 text-center" style="max-width: 420px;">
        <div class="text-primary mb-3">
            <i class="bi bi-wifi-off display-3 text-secondary"></i>
        </div>
        <h4 class="fw-bold mb-2">Koneksi Terputus</h4>
        <p class="text-muted small mb-4">
            Anda sedang tidak terhubung ke jaringan internet. Periksa koneksi data atau Wi-Fi Anda untuk melanjutkan penggunaan SIPA.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary rounded-pill px-4 shadow-sm">
            <i class="bi bi-arrow-clockwise me-1"></i> Coba Muat Ulang
        </button>
    </div>
</body>
</html>
